[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labchart_parser"
version = "0.2.0"
description = "Parser for ADInstruments LabChart text exports"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Damien Bachasson", email = "damien.bachasson@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
keywords = ["LabChart", "parser", "ADInstruments", "physiology", "signals"]

[project.urls]
Homepage = "https://github.com/Neures-1158/labchart_txt_parser"
Repository = "https://github.com/Neures-1158/labchart_txt_parser"
Changelog = "https://github.com/Neures-1158/labchart_txt_parser/blob/main/CHANGELOG.md"
Issues = "https://github.com/Neures-1158/labchart_txt_parser/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
